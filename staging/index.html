<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ACT Tool Staging - Input</title>
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      max-width: 760px;
      margin: 0 auto;
      padding: 24px;
      color: #202124;
      font-family: Arial, sans-serif;
      line-height: 1.5;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.75rem;
    }

    .intro {
      margin: 0 0 24px;
      color: #4b5563;
    }

    .domain {
      padding: 20px 0;
      border-top: 1px solid #d8dde3;
    }

    label {
      display: block;
      margin-top: 14px;
      font-weight: 700;
    }

    select,
    textarea,
    input[type="email"] {
      width: 100%;
      margin-top: 6px;
      padding: 10px;
      border: 1px solid #9aa0a6;
      border-radius: 4px;
      background: #fff;
      color: #202124;
      font: inherit;
    }

    select:focus,
    textarea:focus,
    input:focus,
    button:focus {
      outline: 3px solid rgba(0, 91, 187, 0.25);
      outline-offset: 2px;
    }

    textarea {
      min-height: 88px;
      resize: vertical;
    }

    .helper-text {
      margin: 6px 0 10px;
      color: #5f6368;
      font-size: 0.9rem;
    }

    button {
      min-height: 44px;
      margin-top: 20px;
      padding: 10px 20px;
      border: 0;
      border-radius: 4px;
      background: #005bbb;
      color: #fff;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 700;
    }

    button:hover {
      background: #004799;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    #statusMessage {
      min-height: 24px;
      margin-top: 18px;
      font-weight: 700;
    }

    .captcha-container {
      min-height: 78px;
      margin-top: 20px;
    }

    .error {
      color: #b3261e;
    }

    @media (max-width: 520px) {
      body {
        padding: 18px;
      }
    }

    @media (max-width: 350px) {
      .g-recaptcha {
        transform: scale(0.9);
        transform-origin: left top;
      }

      .captcha-container {
        min-height: 71px;
      }
    }
  </style>
</head>
<body>
  <main>
    <p class="intro"><strong>Test environment:</strong> submissions use the protected version 13 backend.</p>
    <h1 id="pageTitle">ACT Tool Input Form</h1>
    <p class="intro">Score each ACT domain and describe the intervention functions it supports.</p>

    <form id="actForm">
      <input id="responseId" type="hidden" name="id">

      <label for="email">Email address</label>
      <input id="email" type="email" name="email" maxlength="254" autocomplete="email" required>
      <p id="emailHelp" class="helper-text">Your results and private edit link will be sent to this address.</p>

      <div id="domains"></div>
      <div class="captcha-container">
        <div class="g-recaptcha" data-sitekey="6LcGM20tAAAAAKGKhne21f8ebEXj3Tleks4QUQO8"></div>
      </div>
      <button id="submitButton" type="submit">See the radar</button>
    </form>

    <div id="statusMessage" role="status" aria-live="polite"></div>
  </main>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycby0FVdZivjPB9a4tN3d_yI6jMzbeWPV6TZZczX-d0vgVONUA8Hs9u0-tP9RCxUSRDvt/exec";
    const MAX_FUNCTION_LENGTH = 5000;
    const domainDescriptions = {
      Capability: "Skills, knowledge, and confidence to act effectively.",
      Motivation: "Willingness and drive to engage and persist.",
      Connectivity: "Strength and density of relationships across the system.",
      Segmentation: "Presence of isolated subgroups or silos.",
      Prominence: "Influence and visibility of champions or key actors.",
      Norms: "Shared expectations, values, and cultural practices.",
      Processes: "Standard routines, decision flows, and operations.",
      Governance: "Structures that guide oversight and leadership.",
      Resources: "Facilities, tools, and assets that support action."
    };

    const form = document.getElementById("actForm");
    const statusMessage = document.getElementById("statusMessage");
    const submitButton = document.getElementById("submitButton");

    function createDomainFields() {
      const container = document.getElementById("domains");

      Object.entries(domainDescriptions).forEach(([domain, description]) => {
        const block = document.createElement("section");
        block.className = "domain";

        const scoreLabel = document.createElement("label");
        scoreLabel.htmlFor = domain;
        scoreLabel.textContent = domain + " score (1-5)";

        const select = document.createElement("select");
        select.id = domain;
        select.name = domain;
        select.required = true;

        const placeholder = document.createElement("option");
        placeholder.value = "";
        placeholder.disabled = true;
        placeholder.selected = true;
        placeholder.textContent = "Select a score";
        select.appendChild(placeholder);

        for (let score = 1; score <= 5; score += 1) {
          const option = document.createElement("option");
          option.value = String(score);
          option.textContent = String(score);
          select.appendChild(option);
        }

        const helper = document.createElement("p");
        helper.className = "helper-text";
        helper.textContent = description;

        const functionLabel = document.createElement("label");
        functionLabel.htmlFor = domain + "_function";
        functionLabel.textContent = domain + " functions";

        const textarea = document.createElement("textarea");
        textarea.id = domain + "_function";
        textarea.name = domain + "_function";
        textarea.maxLength = MAX_FUNCTION_LENGTH;

        block.append(scoreLabel, select, helper, functionLabel, textarea);
        container.appendChild(block);
      });
    }

    function setStatus(message, isError) {
      statusMessage.textContent = message;
      statusMessage.classList.toggle("error", Boolean(isError));
    }

    async function populateForm(id) {
      setStatus("Loading your response...", false);
      submitButton.disabled = true;

      try {
        const response = await fetch(WEB_APP_URL + "?id=" + encodeURIComponent(id));
        const result = await response.json();
        if (!response.ok || !result.success) {
          throw new Error(result.error || "Unable to load the response.");
        }

        document.getElementById("responseId").value = id;
        document.getElementById("pageTitle").textContent = "Edit Your ACT Response";
        document.getElementById("emailHelp").textContent =
          "Enter the same email address used for the original response.";
        submitButton.textContent = "Update the radar";

        Object.entries(result.entry).forEach(([key, value]) => {
          const input = form.elements.namedItem(key);
          if (input) {
            input.value = value;
          }
        });
        setStatus("", false);
      } catch (error) {
        setStatus(error.message || "Unable to load the response.", true);
      } finally {
        submitButton.disabled = false;
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const captchaToken = form.elements.namedItem("g-recaptcha-response");
      if (!captchaToken || !captchaToken.value) {
        setStatus("Complete the reCAPTCHA verification.", true);
        return;
      }

      submitButton.disabled = true;
      setStatus("Submitting your responses...", false);

      try {
        const params = new URLSearchParams(new FormData(form));
        const response = await fetch(WEB_APP_URL, {
          method: "POST",
          body: params
        });
        const result = await response.json();
        if (!response.ok || !result.success) {
          throw new Error(result.error || "Submission failed.");
        }

        const resultUrl = new URL("act-results.html", window.location.href);
        resultUrl.searchParams.set("id", result.id);
        if (result.emailSent === false) {
          resultUrl.searchParams.set("email", "failed");
        }
        window.location.assign(resultUrl.href);
      } catch (error) {
        setStatus(error.message || "Submission failed. Please try again.", true);
        submitButton.disabled = false;
        if (window.grecaptcha) {
          window.grecaptcha.reset();
        }
      }
    });

    createDomainFields();
    const editId = new URLSearchParams(window.location.search).get("id");
    if (editId) {
      populateForm(editId);
    }
  </script>
</body>
</html>
